
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOXERA - Account Recovery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #535355;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    .brand {
      margin: 0 0 6px;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      margin-bottom: 22px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      flex: 1;
      padding: 12px 4px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #666;
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      border-bottom-color: #f59e0b;
      color: #222;
      font-weight: bold;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .description {
      margin: 0 0 20px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 42px;
      margin-bottom: 16px;
      padding: 0 12px;
      border: 1px solid #bbb;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #777;
    }

    .button {
      width: 100%;
      min-height: 42px;
      margin-top: 8px;
      padding: 11px 14px;
      border: 0;
      border-radius: 4px;
      background: #f59e0b;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .discord-button {
      background: #5865f2;
    }

    .button:active {
      filter: brightness(0.92);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 10px;
      color: #888;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      background: #f2f2f2;
      color: #444;
      font-size: 13px;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #555;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="panel">
    <h1 class="brand">BLOXERA</h1>
    <p class="subtitle">Recover access to your account.</p>

    <div class="tabs">
      <button class="tab active" id="usernameTab"
              type="button" aria-selected="true">
        Forgot Username
      </button>

      <button class="tab" id="passwordTab"
              type="button" aria-selected="false">
        Forgot Password
      </button>
    </div>

    <section id="usernameSection">
      <h2>Forgot Username</h2>
      <p class="description">
        Authorize your Discord account to recover your BLOXERA username.
      </p>

      <button class="button discord-button" id="discordUsername"
              type="button">
        Continue with Discord
      </button>
    </section>

    <section id="passwordSection" hidden>
      <h2>Forgot Password</h2>
      <p class="description">
        Authorize the Discord account linked to your BLOXERA account
        to begin password recovery.
      </p>

      <label for="username">BLOXERA Username</label>
      <input id="username" name="username"
             autocomplete="username"
             placeholder="Enter your username">

      <button class="button discord-button" id="discordPassword"
              type="button">
        Continue with Discord
      </button>

      <div class="divider">THEN</div>

      <button class="button" id="recoverPassword" type="button">
        Recover Password
      </button>
    </section>

    <div class="status" id="status" role="status"></div>

    <a class="back-link" href="/">Back to Login</a>
  </main>

  <script>
    const API_BASE = "https://bloxera.2020multihq.workers.dev";

    const usernameTab = document.getElementById("usernameTab");
    const passwordTab = document.getElementById("passwordTab");
    const usernameSection = document.getElementById("usernameSection");
    const passwordSection = document.getElementById("passwordSection");
    const status = document.getElementById("status");

    function showTab(tab) {
      const showUsername = tab === "username";

      usernameSection.hidden = !showUsername;
      passwordSection.hidden = showUsername;

      usernameTab.classList.toggle("active", showUsername);
      passwordTab.classList.toggle("active", !showUsername);

      usernameTab.setAttribute("aria-selected", showUsername);
      passwordTab.setAttribute("aria-selected", !showUsername);

      status.style.display = "none";
      status.textContent = "";
    }

    function showMessage(message) {
      status.textContent = message;
      status.style.display = "block";
    }

    usernameTab.addEventListener("click", () => showTab("username"));
    passwordTab.addEventListener("click", () => showTab("password"));

    document.getElementById("discordUsername").addEventListener("click", () => {
      showMessage(
        "Discord authorization is not connected yet. Account recovery is not available."
      );
    });

    document.getElementById("discordPassword").addEventListener("click", () => {
      showMessage(
        "Discord authorization is not connected yet. Account recovery is not available."
      );
    });

    document.getElementById("recoverPassword").addEventListener("click", () => {
      const username = document.getElementById("username").value.trim();

      if (!username) {
        showMessage("Please enter your BLOXERA username.");
        return;
      }

      showMessage(
        "Password recovery is not connected yet. Your account has not been changed."
      );
    });
  </script>
</body>
</html>
