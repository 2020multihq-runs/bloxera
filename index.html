
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOXERA</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: rgb(83, 83, 85);
  font-family: "Builder Sans", Arial, sans-serif;
  font-weight: 700;
}

.logo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(65vw, 360px);
  height: auto;
  transform: translate(-50%, -50%);
  object-fit: contain;
}

.loading {
  position: absolute;
  bottom: 24px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 13px;
  color: #fff;
}

#dots {
  display: inline-block;
  width: 18px;
  text-align: left;
}
</style>
</head>

<body>
  <img
    class="logo"
    src="BloXera-18-10-2026.png"
    alt="BLOXERA"
  >

  <div class="loading">
    Loading<span id="dots">.</span>
  </div>

<script>
const dots = document.getElementById("dots");
let count = 1;

setInterval(() => {
  count = count >= 3 ? 1 : count + 1;
  dots.textContent = ".".repeat(count);
}, 350);
</script>
</body>
</html>
