
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOXERA</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #fff;
  font-family: "Builder Sans", Arial, sans-serif;
  font-weight: 700;
}

.logo {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(65vw, 360px);
  height: auto;
  transform: translate(-50%, -50%);
  object-fit: contain;
}

.loading {
  position: absolute;
  bottom: 24px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 13px;
  color: #777;
}

.dots span {
  opacity: 0;
  animation: dot 1.2s infinite;
}

.dots span:nth-child(1) {
  animation-delay: 0s;
}

.dots span:nth-child(2) {
  animation-delay: 0.2s;
}

.dots span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes dot {
  0%, 20% { opacity: 0; }
  40%, 80% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>

<body>
  <img
    class="logo"
    src="BloXera-18-10-2026.png"
    alt="BLOXERA"
  >

  <div class="loading">
    Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span>
  </div>
</body>
</html>
