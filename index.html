<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOXERA</title>
  <style>
    * {
      box-sizing: border-box;
    }body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  display: flex;
  align-items: center;
  justify-content: center;
}

.account-options {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(320px, calc(100% - 40px));
}

a {
  display: block;
  padding: 14px 20px;
  border-radius: 5px;
  text-align: center;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
}

.login {
  background: #0876d9;
  color: white;
}

.signup {
  background: white;
  color: #0876d9;
  border: 1px solid #0876d9;
}

a:focus-visible {
  outline: 3px solid #222;
  outline-offset: 3px;
}

  </style>
</head>
<body>
  <main class="account-options">
    <a class="login" href="login.html">Login</a>
    <a class="signup" href="signup.html">Sign Up</a>
  </main>
</body>
</html>
